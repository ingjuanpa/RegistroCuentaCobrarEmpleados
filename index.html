<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro V4 Final - NIT 34.994.561</title>
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial}
.top{background:#181A2E;padding:14px;text-align:center;font-weight:900;position:sticky;top:0;z-index:10}
.top span{color:#FFA23A}
.card{max-width:700px;margin:12px auto;background:#1E1E1E;padding:14px;border-radius:12px}
label{font-size:12px;color:#aaa}
input{width:100%;padding:11px;box-sizing:border-box;border-radius:8px;border:none;background:#2A2A2A;color:#fff;margin-top:4px;font-size:15px}
button{width:100%;padding:13px;border:none;border-radius:10px;font-weight:900;margin-top:8px;cursor:pointer;font-size:14px}
.btn-mic{background:#B4332A;color:#fff;padding:20px;font-size:18px;user-select:none}
.btn-mic.active{background:#00C950;transform:scale(1.02)}
.nota{background:#2A2A2A;padding:12px;border-radius:8px;margin-top:8px;border-left:4px solid #555;display:flex;justify-content:space-between;cursor:pointer}
.nota.selected{border-left-color:#FFA23A;background:#332800;border:2px solid #FFA23A}
.btn-row{display:flex;gap:8px}
.btn-green{background:#0A7A42;color:#fff}
.btn-yellow{background:#FFA23A;color:#000}
.btn-red{background:#B4332A;color:#fff}
.btn-dark{background:#333;color:#fff}
.step{display:flex;gap:6px;margin-top:8px}
.step div{flex:1;padding:9px;border-radius:8px;background:#2A2A2A;text-align:center;font-size:11px;border:2px solid transparent}
.step div.on{background:#FFA23A;color:#000;font-weight:900}
#log{font-size:12px;color:#FFA23A;margin-top:6px;min-height:18px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:99}
#modalBox{background:#1E1E1E;padding:16px;border-radius:12px;width:90%;max-width:380px}
</style>
</head>
<body>
<div class="top">REGISTRO V4 FINAL - NIT <span>34.994.561</span></div>

<div class="card">
<label>1. FECHA DE LA JORNADA</label>
<input type="date" id="fechaJ">
<div class="step"><div id="s1" class="on">1.NOMBRE</div><div id="s2">2.CONCEPTO</div><div id="s3">3.VALOR</div></div>
<button id="btnMic" class="btn-mic">🎤 MANTENER OPRIMIDO<br><small>NOMBRE... (2s) CONCEPTO... (2s) VALOR</small></button>
<div id="log">Suelto = guarda automático</div>
<div style="display:flex;gap:6px;margin-top:6px">
<input id="iN" placeholder="Nombre">
<input id="iC" placeholder="Concepto">
<input id="iV" type="number" placeholder="Valor">
</div>
<button id="btnOtro" class="btn-dark">➕ REGISTRAR OTRO AUDIO</button>
</div>

<div class="card">
<b>Notas <span id="fechaTxt"></span> (<span id="count">0</span>) - Toca para seleccionar</b>
<div id="lista"></div>

<div id="actions" class="btn-row" style="display:none;margin-top:10px">
<button id="btnEdit" class="btn-yellow">✏️ EDITAR SELECCIONADA</button>
<button id="btnDel" class="btn-red">🗑️ BORRAR SELECCIONADA</button>
</div>

<button id="btnFin" class="btn-green">📄 FINALIZAR JORNADA - TXT</button>
<div id="accionesFinal" style="display:none;margin-top:10px">
<div class="btn-row">
<button id="btnNuevaJornada" class="btn-yellow">📅 SELECCIONAR NUEVA JORNADA</button>
<button id="btnReiniciar" class="btn-red">🔄 REINICIAR JORNADA</button>
</div>
</div>
<div id="resumen" style="margin-top:10px"></div>
</div>

<div id="modal"><div id="modalBox">
<b>✏️ EDITAR NOTA</b>
<label>Nombre</label><input id="eN">
<label>Concepto</label><input id="eC">
<label>Valor $</label><input id="eV" type="number">
<button id="saveE" class="btn-green">GUARDAR CAMBIOS</button>
<button id="cancelE" class="btn-dark">CANCELAR</button>
</div></div>

<script>
let notas=JSON.parse(localStorage.getItem('notas_cxc')||'[]');
let sel=null;
let fechaJ=document.getElementById('fechaJ');
fechaJ.valueAsDate=new Date();
document.getElementById('fechaTxt').textContent=fechaJ.value;
fechaJ.onchange=()=>{ document.getElementById('fechaTxt').textContent=fechaJ.value; render(); };

let step=0, buffers=["","",""], rec=null, listening=false, curText="", silenceTimer=null;
function setStep(n){
 step=n;
 document.querySelectorAll('.step div').forEach((d,i)=>d.className=i==n?'on':'');
 document.getElementById('log').textContent=['Di NOMBRE','Di CONCEPTO','Di VALOR'][n];
}
function save(){ localStorage.setItem('notas_cxc',JSON.stringify(notas)); render(); }

function render(){
 let lista=document.getElementById('lista'); lista.innerHTML='';
 let delDia=notas.map((n,i)=>({...n,g:i})).filter(n=>n.fecha==fechaJ.value);
 delDia.forEach((n,i)=>{
  lista.innerHTML+=`<div class="nota ${n.g==sel?'selected':''}" onclick="selNote(${n.g})"><div><b>NOTA ${i+1},</b> ${n.nombre.toUpperCase()}, ${n.concepto.toUpperCase()}, ${n.valor}$</div><div>${n.g==sel?'👉':''}</div></div>`;
 });
 document.getElementById('count').textContent=delDia.length;
 document.getElementById('actions').style.display=sel!==null?'flex':'none';
}
window.selNote=(g)=>{ sel=sel===g?null:g; render(); };

document.getElementById('btnDel').onclick=()=>{ if(sel!==null && confirm('¿Borrar NOTA seleccionada?')){ notas.splice(sel,1); sel=null; save(); } };
document.getElementById('btnEdit').onclick=()=>{
 if(sel===null) return;
 let n=notas[sel];
 document.getElementById('eN').value=n.nombre;
 document.getElementById('eC').value=n.concepto;
 document.getElementById('eV').value=n.valor;
 document.getElementById('modal').style.display='flex';
};
document.getElementById('cancelE').onclick=()=>document.getElementById('modal').style.display='none';
document.getElementById('saveE').onclick=()=>{
 notas[sel].nombre=document.getElementById('eN').value.trim();
 notas[sel].concepto=document.getElementById('eC').value.trim();
 notas[sel].valor=parseInt(document.getElementById('eV').value)||0;
 document.getElementById('modal').style.display='none';
 sel=null; save();
};

// VOZ FIX SIN DUPLICADOS
function startRec(){
 if(listening) return;
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){ alert('Usa Chrome en Android'); return; }
 rec=new SR(); rec.lang='es-CO'; rec.continuous=false; rec.interimResults=false;
 buffers=["","",""]; curText=""; step=0; listening=true; setStep(0);
 document.getElementById('btnMic').classList.add('active');
 document.getElementById('btnMic').innerHTML='🔴 ESCUCHANDO... DI NOMBRE';
 rec.onresult=(e)=>{
  let t=e.results[0][0].transcript.trim();
  buffers[step]=t;
  if(step==0) document.getElementById('iN').value=t;
  if(step==1) document.getElementById('iC').value=t;
  if(step==2) document.getElementById('iV').value=t.replace(/[^0-9]/g,'');
  clearTimeout(silenceTimer);
  silenceTimer=setTimeout(()=>{
   step++;
   if(step<3){
    setStep(step);
    document.getElementById('btnMic').innerHTML='🔴 SIGUE... AHORA '+['NOMBRE','CONCEPTO','VALOR'][step];
    try{ rec.start(); }catch{}
   } else {
    stopRec();
   }
  },2000);
 };
 rec.onend=()=>{ if(listening && step<3){ try{ rec.start(); }catch{} } };
 rec.start();
}
function stopRec(){
 listening=false;
 if(rec) try{rec.stop()}catch{};
 rec=null; clearTimeout(silenceTimer);
 document.getElementById('btnMic').classList.remove('active');
 document.getElementById('btnMic').innerHTML='🎤 MANTENER OPRIMIDO<br><small>NOMBRE... (2s) CONCEPTO... (2s) VALOR</small>';
 let nombre=(buffers[0]||document.getElementById('iN').value).trim();
 let concepto=(buffers[1]||document.getElementById('iC').value).trim()||'varios';
 let valorRaw=(buffers[2]||document.getElementById('iV').value).toString();
 let valor=parseInt(valorRaw.replace(/[^0-9]/g,''))||0;
 if(nombre && valor>0){
  notas.push({nombre,concepto,valor,fecha:fechaJ.value});
  save();
  document.getElementById('iN').value=''; document.getElementById('iC').value=''; document.getElementById('iV').value='';
  buffers=["","",""]; setStep(0);
  document.getElementById('log').textContent=`✅ NOTA ${notas.filter(n=>n.fecha==fechaJ.value).length}: ${nombre} - ${valor}`;
 }
}
let b=document.getElementById('btnMic');
b.addEventListener('touchstart',e=>{ e.preventDefault(); startRec(); });
b.addEventListener('touchend',e=>{ e.preventDefault(); if(step<2) stopRec(); });
b.addEventListener('mousedown',startRec);
b.addEventListener('mouseup',()=>{ if(step<2) stopRec(); });

// OTRO AUDIO MANUAL
document.getElementById('btnOtro').onclick=()=>{
 let n=document.getElementById('iN').value.trim(), c=document.getElementById('iC').value.trim()||'varios', v=parseInt(document.getElementById('iV').value)||0;
 if(n&&v>0){ notas.push({nombre:n,concepto:c,valor:v,fecha:fechaJ.value}); save(); document.getElementById('iN').value=''; document.getElementById('iC').value=''; document.getElementById('iV').value=''; }
};

// FINALIZAR
document.getElementById('btnFin').onclick=()=>{
 let delDia=notas.filter(n=>n.fecha==fechaJ.value);
 if(!delDia.length) return alert('Sin notas para esta fecha');
 let por={}; let tot=0;
 delDia.forEach(n=>{ let k=n.nombre.toUpperCase(); por[k]=(por[k]||0)+n.valor; tot+=n.valor; });
 let txt=`REGISTRO CUENTAS COBRAR - NIT 34.994.561\nFECHA: ${fechaJ.value}\n------------------------------\n`;
 delDia.forEach((n,i)=>txt+=`NOTA ${i+1}, ${n.nombre.toUpperCase()}, ${n.concepto.toUpperCase()}, ${n.valor}$\n`);
 txt+=`\nRESUMEN POR PERSONA:\n`;
 Object.entries(por).forEach(([k,v])=>txt+=`${k}: $${v}\n`);
 txt+=`------------------------------\nTOTAL: $${tot}\n`;
 let blob=new Blob([txt],{type:'text/plain'});
 let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`Jornada_${fechaJ.value}.txt`; a.click();
 document.getElementById('resumen').innerHTML=`<pre style="background:#FFA23A;color:#000;padding:12px;border-radius:8px;white-space:pre-wrap">${txt}</pre>`;
 document.getElementById('accionesFinal').style.display='block';
 document.getElementById('btnFin').style.display='none';
 if(confirm('¿Enviar por WhatsApp?')) window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
};

// NUEVA JORNADA Y REINICIAR
document.getElementById('btnNuevaJornada').onclick=()=>{
 let nueva=prompt('Nueva jornada (AAAA-MM-DD):', new Date().toISOString().slice(0,10));
 if(nueva){ fechaJ.value=nueva; } else { fechaJ.valueAsDate=new Date(); }
 document.getElementById('fechaTxt').textContent=fechaJ.value;
 document.getElementById('resumen').innerHTML='';
 document.getElementById('accionesFinal').style.display='none';
 document.getElementById('btnFin').style.display='block';
 sel=null; render(); setStep(0);
 document.getElementById('log').textContent='Nueva jornada: '+fechaJ.value;
};
document.getElementById('btnReiniciar').onclick=()=>{
 if(!confirm('¿Reiniciar jornada '+fechaJ.value+'? Se borrarán '+notas.filter(n=>n.fecha==fechaJ.value).length+' notas')) return;
 notas=notas.filter(n=>n.fecha!=fechaJ.value);
 save();
 document.getElementById('resumen').innerHTML='';
 document.getElementById('accionesFinal').style.display='none';
 document.getElementById('btnFin').style.display='block';
 sel=null;
 document.getElementById('log').textContent='Jornada reiniciada';
};

render(); setStep(0);
</script>
</body>
</html>
